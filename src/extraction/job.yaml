# Definición del Cloud Run Job de extracción. El CI reemplaza ${PROJECT_ID},
# ${AMBIENTE}, ${REGION} e ${IMAGE} con los valores del ambiente y aplica el archivo con
#   gcloud run jobs replace job.yaml --region <región>
# El mismo archivo sirve para dev y prod. No se incluye en la imagen.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ${PROJECT_ID}-crj-extraction
spec:
  template:
    metadata:
      annotations:
        # Todo el tráfico sale por la VPC: Cloud NAT con la IP fija autorizada en MariaDB.
        run.googleapis.com/vpc-access-egress: all-traffic
        run.googleapis.com/network-interfaces: '[{"network":"${PROJECT_ID}-vpc","subnetwork":"${PROJECT_ID}-snet-${REGION}"}]'
    spec:
      taskCount: 1  # el extractor no reparte tablas entre tareas
      template:
        spec:
          serviceAccountName: sa-extraction-${AMBIENTE}@${PROJECT_ID}.iam.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 3600
          containers:
            - image: ${IMAGE}
              resources:
                limits:
                  cpu: "1"
                  memory: 4Gi
              env:
                - name: GCS_BUCKET
                  value: ${PROJECT_ID}-cs-landing
                # Dev y prod leen la misma MariaDB: los datos de conexión van escritos aquí.
                - name: MYSQL_HOST
                  value: 75.102.22.88
                - name: MYSQL_PORT
                  value: "3306"
                - name: MYSQL_DATABASE
                  value: pgjrtiux_intranet
                - name: MYSQL_USER
                  value: pgjrtiux
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: MYSQL_PASSWORD  # secreto en Secret Manager del proyecto
                      key: latest           # versión
